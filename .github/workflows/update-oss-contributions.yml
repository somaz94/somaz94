name: Update OSS Contributions

# Regenerates OSS_CONTRIBUTIONS.md and data/oss-stats.json from live GitHub data
# (merged + open PRs the owner opened against external repos). README.md only
# changes if its OSS marker block was hand-edited, since that block is constant.
# Curated summaries live in scripts/oss_contributions_overrides.json.

on:
  schedule:
    - cron: '0 22 * * *'   # 07:00 KST daily
  # Humans push only the ledger or the generator; this job commits the outputs.
  push:
    branches: [main]
    paths:
      - scripts/oss_contributions.py
      - scripts/oss_contributions_overrides.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oss-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test generator
        run: python3 -m unittest discover -s scripts

      - name: Regenerate OSS contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/oss_contributions.py

      - name: Commit and push if changed
        run: |
          OUTPUTS="README.md OSS_CONTRIBUTIONS.md data/oss-stats.json"
          if [ -z "$(git status --porcelain $OUTPUTS)" ]; then
            echo "OSS outputs already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $OUTPUTS
          git commit -m "docs: auto-update OSS contributions section"
          git push
